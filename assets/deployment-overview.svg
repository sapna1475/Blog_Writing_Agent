<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 380" width="1240" height="380" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- background (keeps the diagram readable on GitHub dark mode) -->
  <rect width="1240" height="380" rx="14" fill="#ffffff"/>

  <!-- AWS region boundary -->
  <rect x="210" y="20" width="770" height="340" rx="14" fill="#fffaf2" stroke="#FF9900" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="230" y="46" font-size="14" font-weight="700" fill="#b45309">AWS  ·  us-east-1</text>

  <!-- Developer -->
  <rect x="30" y="60" width="140" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="90" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Developer</text>
  <text x="100" y="110" font-size="12" fill="#475569" text-anchor="middle">docker build</text>

  <!-- User -->
  <rect x="30" y="250" width="140" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="280" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">User</text>
  <text x="100" y="300" font-size="12" fill="#475569" text-anchor="middle">Streamlit / curl</text>

  <!-- ECR -->
  <rect x="250" y="60" width="170" height="70" rx="10" fill="#ffffff" stroke="#FF9900" stroke-width="2"/>
  <text x="335" y="90" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Amazon ECR</text>
  <text x="335" y="110" font-size="12" fill="#475569" text-anchor="middle">blog-writing-agent:latest</text>

  <!-- ALB -->
  <rect x="250" y="250" width="170" height="70" rx="10" fill="#ffffff" stroke="#FF9900" stroke-width="2"/>
  <text x="335" y="280" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Load Balancer</text>
  <text x="335" y="300" font-size="12" fill="#475569" text-anchor="middle">ALB · health check /health</text>

  <!-- ECS Fargate -->
  <rect x="520" y="110" width="250" height="160" rx="12" fill="#ffffff" stroke="#FF9900" stroke-width="3"/>
  <text x="645" y="158" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">ECS Fargate</text>
  <text x="645" y="184" font-size="13" fill="#475569" text-anchor="middle">Container: FastAPI + LangGraph</text>
  <text x="645" y="206" font-size="13" fill="#475569" text-anchor="middle">Port 8000</text>
  <text x="645" y="240" font-size="12" fill="#94a3b8" text-anchor="middle">blog-writing-agent-cluster</text>

  <!-- CloudWatch -->
  <rect x="820" y="60" width="140" height="70" rx="10" fill="#ffffff" stroke="#FF9900" stroke-width="2"/>
  <text x="890" y="90" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">CloudWatch</text>
  <text x="890" y="110" font-size="12" fill="#475569" text-anchor="middle">Logs</text>

  <!-- External services (outside AWS) -->
  <rect x="1020" y="235" width="190" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1115" y="265" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">External services</text>
  <text x="1115" y="288" font-size="12" fill="#475569" text-anchor="middle">Hugging Face · Tavily</text>
  <text x="1115" y="306" font-size="12" fill="#475569" text-anchor="middle">Gemini · Postgres</text>

  <!-- Arrows: deploy flow -->
  <path d="M170,95 H250" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="210" y="85" font-size="12" fill="#334155" text-anchor="middle">push</text>

  <path d="M420,95 H645 V110" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="535" y="85" font-size="12" fill="#334155" text-anchor="middle">image pull</text>

  <!-- Arrows: request flow -->
  <path d="M170,285 H250" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="210" y="275" font-size="12" fill="#334155" text-anchor="middle">HTTP :80</text>

  <path d="M420,285 H645 V270" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="535" y="275" font-size="12" fill="#334155" text-anchor="middle">forward :8000</text>

  <!-- Arrows: outputs -->
  <path d="M770,150 H855 V130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="815" y="142" font-size="12" fill="#334155" text-anchor="middle">logs</text>

  <path d="M770,245 H880 V285 H1020" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="950" y="277" font-size="12" fill="#334155" text-anchor="middle">API calls</text>
</svg>
